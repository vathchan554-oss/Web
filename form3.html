<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input</title>
</head>
<body>
    <form action="" style="width: 30vw; height: 45vh; border: 5px solid rgb(215, 15, 15); margin: 90px auto; padding: 20px; border-radius: 20px;  ">
        <fieldset>
            <legend style="font-size: 28px; font-family:sans-serif; margin-bottom: 20px; color: brown;">Person Information</legend>

            <label for="" style="font-size: 25px; font-family: sans-serif;">Full Name</label>
            <input type="text" style="width: 98%; height: 40px; border: 1px solid gray; border-radius: 10px; margin-bottom: 20px; font-size: 25px;">

            <label for="" style="font-size: 25px; font-family: sans-serif;">Email</label>
            <input type="email" style="width: 98%; height: 40px; border: 1px solid gray; border-radius: 10px; margin-bottom: 20px; font-size: 25px; ">

            <label for="" style="font-size: 25px; font-family: sans-serif;">Date Of Birth</label> <br>
            <input type="date" style="width: 50%; height: 40px; border: 1px solid gray; border-radius: 10px; margin-bottom: 20px; font-size: 25px; ">
            
        </fieldset> <br>

        <button type="submit" style="width: 100%; font-size: 25px; height: 50px; border-radius: 10px;color: rgb(255, 255, 255); background-color: rgb(0, 0, 140); ">
            Submit
        </button>


        


    </form>
    
</body>
</html>
