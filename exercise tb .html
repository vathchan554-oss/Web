<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>col-row Span</title>
</head>
<body>
    <table border="1" style="width: 80%; font-size: 45px;">
        <tr>
            <th colspan="4">Student</th>
        </tr>
        
        <tr>
            <th>A</th>
            <th>B</th>
            <th>C</th>
            <th>D</th>
        </tr>
        
        <tr>
            <th colspan="3">A</th>
            <th>B</th>
        </tr>

        <tr>
            <th rowspan="2">A</th>
            <th>B</th>
            <th colspan="2">C</th>
        </tr>
        <tr>
            <th>A</th>
            <th colspan="2">B</th>
        </tr>

    </table>
</body>
</html>
