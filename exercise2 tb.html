<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" style="width: 65%; font-size: 40px;">
        <tr>
            <th colspan="4">A</th>
        </tr>

        <tr align="center">
            <td rowspan="2">A</td>
            <td>B</td>
            <td>C</td>
            <td rowspan="2">D</td>
        </tr>
        <tr align="center">
            <td>E</td>
            <td>F</td>
        </tr>
        
        <tr align="center">
            <td colspan="2">G</td>
            <td colspan="2">H</td>
        </tr>

        <tr align="center">
            <td colspan="2" rowspan="2">I</td>
            <td>J</td>
            <td>K</td>
        </tr>
        <tr align="center">
            <td colspan="2">L</td>
        </tr>

    </table>
</body>
</html>
