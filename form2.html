<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body style="background-image: url('pic/background.jpg');">
    <form action=""style="width: 30vw; height: 80vh; padding: 25px; border: 2px solid gray; border-radius: 15px; margin: 70px auto">
        <h2 style="text-align: center; font-size: 40px;">Register</h2>

        <label style="font-size: 35px;" for="">USER</label>
        <input style="width: 98%; margin-bottom: 15px; font-size: 30px; margin-top: 8px; height: 45px; border:1px solid gray; border-radius: 10px;" type="text">

        <label style="font-size: 35px;" for="">EMAIL</label>
        <input style="width: 98%; margin-bottom: 15px; font-size: 30px; margin-top: 8px; height: 45px; border:1px solid gray; border-radius: 10px;" type="email">
    
        <label style="font-size: 35px;" for="">PASSWORD</label>
        <input style="width: 98%; margin-bottom: 30px; font-size: 30px; margin-top: 8px; height: 45px; border:1px solid gray; border-radius: 10px;" type="password">

        <button style="font-size:25px; color: white; font-weight: bold; height: 50px; width: 99%; border: none; border-radius: 10px; background-color: rgb(255, 0, 0);  ">
            Sign Up
        </button>

        <p style="text-align: center;">Or Sign In with</p>

        <button style="font-size:25px; color: rgb(0, 0, 0); font-weight: bold; height: 50px; width: 99%; border: none; border-radius: 10px; background-color: rgb(255, 255, 255); margin-bottom: 30px; ">
            Google
        </button>

        <button style="font-size:25px; color: white; font-weight: bold; height: 50px; width: 99%; border: none; border-radius: 10px; background-color: rgb(13, 0, 255);  ">
            Facebook
        </button>

    
    
    </form>
</body>
</html>
